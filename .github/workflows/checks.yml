name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-repository:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python syntax
        run: python -m compileall -q scripts
      - name: Shell syntax
        shell: zsh {0}
        run: |
          for script in scripts/*.sh *.command; do
            zsh -n "$script"
          done
      - name: Public file and documentation checks
        run: python scripts/check_public_repo.py
      - name: Clean checkout runtime restore
        run: |
          python scripts/runtime_seed.py check
          python scripts/runtime_seed.py restore
      - name: Installer recovery and compatibility
        run: python -m unittest discover -s tests -v
